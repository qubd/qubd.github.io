<canvas id="canvas" width="1000" height="700">

</canvas>

<script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.14.0/jquery-ui.min.js"></script>
<script type="text/javascript">

<script type="text/javascript" src="jquery-1.5.1.min.js"></script>
<script type="text/javascript" src="jquery-ui-1.8.12.custom.min.js"></script>
<link href="jquery-ui-1.8.12.custom.css" rel="stylesheet" type="text/css"/>

<script type="text/javascript">

//Interactive t-table by Evan Haldane & Brendan Cordy

var mycanvas=document.getElementById("canvas");
var context=mycanvas.getContext("2d");

//Set dimensions of the canvas
var width = 1000;
var height = 500;

//Set range of z values
var zMin = 0.0;
var zMax = 12.0;
var zRange = zMax - zMin;
var yMax = 1.111*0.398942;

//Initial pixel positions of df slider and initial df
var dfPixel = 45;
var df = 1;
var dfRange = 9;

//Initial pixel positions of left and right points
var zPixelLeft = 255;
var zPixelRight = 1000;

//Initial z values of left and right points
var zLeft = zMin + zPixelLeft/width*zRange;
var zRight = zMin + zPixelRight/width*zRange;

//Both points begin stuck to the canvas
var isStuckdf = true;
var isStuckL = true;
var isStuckR = true;
var mouseX = 0;
var ypos = 0;

//Both points begin with finite z values
var leftIsInfinity = 0;
var rightIsInfinity = 0;

//Approximation of the logarithm of the gamma function
function logGamma(x){
	s=1+76.18009173/x-86.50532033/(x+1)+24.01409822/(x+2)-1.231739516/(x+3)+.00120858003/(x+4)-.00000536382/(x+5);
	return (x-.5)*Math.log(x+4.5)-(x+4.5)+Math.log(s*2.50662827465);
}

function normPdf(x, m,s){
	return 0.39894228/s*Math.exp(-0.5*((x-m)/s)*((x-m)/s));
}

function stdNormCumProb(x){
	if (x<0){
		return 1-stdNormCumProb(-x);
	}
	else if (x===0){
		return 0.5;
	}
	else{
		var b0 = 0.2316419;
		var b1 = 0.319381530;
		var b2 = -0.356563782;
		var b3 = 1.781477937;
		var b4 = -1.821255978;
		var b5 = 1.330274429;
		var t = 1/(1+b0*x);
		
		return 1-normPdf(x,0,1)*(b1*t+b2*Math.pow(t,2)+b3*Math.pow(t,3)+b4*Math.pow(t,4)+b5*Math.pow(t,5));
	}
}

function gammaP(a, x) {
    if (x < 0 || a <= 0) return NaN;

    // Series representation for small x
    function gammaSeries(a, x) {
        const EPS = 1e-15;
        let sum = 1 / a;
        let term = 1 / a;
        let n = 1;
        while (term > EPS * sum) {
            term *= x / (a + n);
            sum += term;
            n++;
        }
        return sum * Math.exp(-x + a * Math.log(x) - logGamma(a));
    }

    // Continued fraction representation for large x
    function gammaCF(a, x) {
        const MAXITER = 1000;
        const EPS = 1e-15;
        let fpmin = 1e-300;
        let b = x + 1 - a;
        let c = 1 / fpmin;
        let d = 1 / b;
        let h = d;
        for (let i = 1; i <= MAXITER; i++) {
            let an = -i * (i - a);
            b += 2;
            d = an * d + b;
            if (Math.abs(d) < fpmin) d = fpmin;
            c = b + an / c;
            if (Math.abs(c) < fpmin) c = fpmin;
            d = 1 / d;
            let delta = d * c;
            h *= delta;
            if (Math.abs(delta - 1) < EPS) break;
        }
        return 1 - Math.exp(-x + a * Math.log(x) - logGamma(a)) * h;
    }

    return x < a + 1 ? gammaSeries(a, x) : gammaCF(a, x);
}

function chiSqCumProb(t,df){
	return gammaP(df/2,t/2);
}

function chiSqPdf(x,df){
	return (Math.exp((-x/2)-logGamma(df/2)))*Math.pow(x,(df/2)-1)*Math.pow(2,-df/2);
}

function drawtDist(df,colour){

	context.lineWidth = 3;
	context.strokeStyle = colour;

	var y = chiSqPdf(zMin,df);
	var yPixel = (height-7)*(1 - y/yMax);

	context.beginPath();
	context.moveTo(0,yPixel);

	for(i=0; i<=width; i++){

		var z = zMin + i/width*zRange;
		y = chiSqPdf(z,df);
		yPixel = (height-7)*(1 - y/yMax);

		context.lineTo(i,yPixel);
	}
	context.stroke();
}

function fillCenter(zL,zR,df,colour){

	context.strokeStyle = colour;

	//Ensure that zL is smaller than zR
	if(zR<zL){

		var tmp = zL;
		zL = zR;
		zR = tmp;
	}

	//Fill from left to right
	for(i=zL; i<=zR; i++){

		var z = zMin + i/width*zRange;
		var y = chiSqPdf(z,df);
		var yPixel = (height-7)*(1 - y/yMax);

		context.beginPath();
		context.moveTo(i, yPixel);
		context.lineTo(i, height-7);
		context.stroke();
	}
}

function evaluateArea(zL,zR,df){

	if(leftIsInfinity === 0 && rightIsInfinity === 0){

		if(zR<zL){

			var tmp = zL;
			zL = zR;
			zR = tmp;
		}
		return (Math.round(10000*(chiSqCumProb(zR,df)-chiSqCumProb(zL,df)))/10000);
	}
	else if(leftIsInfinity === -1 && rightIsInfinity === 0){

		return (Math.round(10000*(chiSqCumProb(zR,df)))/10000);
	}
	else if(leftIsInfinity === 1 && rightIsInfinity === 0){

		return (Math.round(10000*(1-chiSqCumProb(zR,df)))/10000);
	}
	else if(leftIsInfinity === 0 && rightIsInfinity === 1){

		return (Math.round(10000*(1-chiSqCumProb(zL,df)))/10000);
	}
	else if(leftIsInfinity === 0 && rightIsInfinity === -1){

		return (Math.round(10000*(chiSqCumProb(zL,df)))/10000);
	}
	else{

		return 1;
	}
}

function drawFullAxis(){

	context.beginPath();
	context.moveTo(15,height-5+10);
	context.lineTo(0,height-5);
	context.lineTo(15,height-5-10);

	context.moveTo(0,height-5);
	context.lineTo(width,height-5);

	context.moveTo(width-15,height-5+10);
	context.lineTo(width,height-5);
	context.lineTo(width-15,height-5-10);
	context.closePath();
}

//Converts floats to strings with two decimal places, zero being the exception
function niceRound(n){
	r = n.toFixed(2);
	if(r==='0.00'){
		return '0';
	}
	else if(r==='-0.00'){
		return '0';
	}
	else{
		return r;
	}
}

function draw(){

	mycanvas.width=mycanvas.width;

	fillCenter(zPixelLeft,zPixelRight,df,"#21ADDB");
	drawtDist(df,"#2B65EC");

	//Draw df slider
	context.lineWidth=4;
	context.strokeStyle = "#000";
	context.beginPath();
	context.moveTo(45,height-400);
	context.lineTo(345, height-400);
	context.stroke();
	context.moveTo(45,height-395);
	context.lineTo(45, height-405);
	context.stroke();
	context.moveTo(345,height-395);
	context.lineTo(345, height-405);
	context.stroke();

	context.font = "22px italic";
	context.textAlign = "center";
	context.fillStyle = '#FF0000';
	if(df == 10000){
		context.fillText('Degrees of Freedom: ∞', 190, height-350);
	}
	else{
		context.fillText('Degrees of Freedom: ' + df, 190, height-350);
	}
	context.beginPath();
	context.strokeStyle = "#FF0000";
	context.arc(dfPixel, height-400, 7, 0, Math.PI * 2, false);
	context.arc(dfPixel, height-400, 4, 0, Math.PI * 2, false);
	context.arc(dfPixel, height-400, 1, 0, Math.PI * 2, false);
	context.closePath();
	context.stroke();

	//Draw Axis
	context.lineWidth=4;
	context.strokeStyle = "#000";
	context.beginPath();
	context.moveTo(0,height-5);
	context.lineTo(width, height-5);
	context.stroke();

	//Left point at -infinity
	if(zPixelLeft < 20){

		if(zPixelRight > width-20){

			drawFullAxis();

			leftIsInfinity = -1;
			rightIsInfinity = 1;
		}
		else{
			//Draw the point and the interval
			context.beginPath();
			context.arc(zPixelRight, height-5, 7, 0, Math.PI * 2, false);
			context.lineTo(0,height-5);
			context.moveTo(15,height-5+10);
			context.lineTo(0,height-5);
			context.lineTo(15,height-5-10);
			context.closePath();

			leftIsInfinity = -1;
			rightIsInfinity = 0;

			//Write the z value underneath
			context.font = "22px italic";
			context.textAlign = "center";
			context.fillStyle = '#FF0000';
			context.fillText(niceRound(zRight), zPixelRight, 0.95*height + 80);
		}
	}
	//Right point at -infinity
	else if(zPixelRight < 20){

		if(zPixelLeft > width-20){

			drawFullAxis();

			leftIsInfinity = 1;
			rightIsInfinity = -1;
		}
		else{
			//Draw the point and the interval
			context.beginPath();
			context.arc(zPixelLeft, height-5, 7, 0, Math.PI * 2, false);
			context.lineTo(0,height-5);
			context.moveTo(15,height-5+10);
			context.lineTo(0,height-5);
			context.lineTo(15,height-5-10);
			context.closePath();

			leftIsInfinity = 0;
			rightIsInfinity = -1;

			//Write the z value underneath
			context.font = "22px italic";
			context.textAlign = "center";
			context.fillStyle = '#FF0000';
			context.fillText(niceRound(zLeft), zPixelLeft, 0.95*height + 80);

		}
	}
	//Left point at infinity
	else if(zPixelLeft > width-20){

		if(zPixelRight < 20){

			drawFullAxis();

			leftIsInfinity = 1;
			rightIsInfinity = -1;
		}
		else{
			//Draw the point and the interval
			context.beginPath();
			context.arc(zPixelRight, height-5, 7, 0, Math.PI * 2, false);
			context.lineTo(width,height-5);
			context.moveTo(width-15,height-5+10);
			context.lineTo(width,height-5);
			context.lineTo(width-15,height-5-10);
			context.closePath();

			leftIsInfinity = 1;
			rightIsInfinity = 0;

			//Write the z value underneath
			context.font = "22px italic";
			context.textAlign = "center";
			context.fillStyle = '#FF0000';
			context.fillText(niceRound(zRight), zPixelRight, 0.95*height + 80);
		}
	}
	//Right point at infinity
	else if(zPixelRight > width-20){

		if(zPixelLeft < 20){

			drawFullAxis();

			leftIsInfinity = -1;
			rightIsInfinity = 1;
		}
		else{
			//Draw the point and the interval
			context.beginPath();
			context.arc(zPixelLeft, height-5, 7, 0, Math.PI * 2, false);
			context.lineTo(width,height-5);
			context.moveTo(width-15,height-5+10);
			context.lineTo(width,height-5);
			context.lineTo(width-15,height-5-10);
			context.closePath();

			leftIsInfinity = 0;
			rightIsInfinity = 1;

			//Write the z value underneath
			context.font = "22px italic";
			context.textAlign = "center";
			context.fillStyle = '#FF0000';
			context.fillText(niceRound(zLeft), zPixelLeft, 0.95*height + 80);

		}
	}
	//Both points finite
	else{
		//Draw both points
		context.beginPath();
		context.arc(zPixelLeft, height-5, 7, 0, Math.PI * 2, false);
		context.arc(zPixelRight, height-5, 7, 0, Math.PI * 2, false);
		context.closePath();

		leftIsInfinity = 0;
		rightIsInfinity = 0;

		//Write the z values underneath
		context.font = "22px italic";
		context.textAlign = "center";
		context.fillStyle = '#FF0000';
		context.fillText(niceRound(zLeft), zPixelLeft, 0.95*height + 80);

		context.font = "22px italic";
		context.textAlign = "center";
		context.fillStyle = '#FF0000';
		context.fillText(niceRound(zRight), zPixelRight, 0.95*height + 80);
	}

	context.strokeStyle = '#FF0000';
	context.stroke();

	context.fillStyle = '#FF0000';
	context.fill();

	//Write the value of the blue area
	context.font = "28px italic";
	context.textAlign = "left";
	context.fillStyle = "#21ADDB";

	//Lots of finicking to deal with infinity and zero cases
	if(leftIsInfinity === 0 && rightIsInfinity === 0){

		zL=zLeft;
		zR=zRight;
		if(zR<zL){

			var tmp = zL;
			zL = zR;
			zR = tmp;
		}
		zR=niceRound(zR);
		zL=niceRound(zL);

		if (zL === '0'){
			context.fillText('P(0 < χ2 < ' + zR + ') = ' + evaluateArea(0,zR,df).toFixed(4), 0.635*width, 0.12*height+80);
		}
		else if (zR === '0'){
			context.fillText('P(' + zL + ' < χ2 < 0) = ' + evaluateArea(zL,0,df).toFixed(4), 0.635*width, 0.12*height+80);
		}
		else{
			context.fillText('P(' + zL + ' < χ2 < ' + zR + ') = ' + evaluateArea(zLeft,zRight,df).toFixed(4), 0.635*width, 0.12*height+80);
		}
	}
	else if(leftIsInfinity === -1 && rightIsInfinity === 0){

		zR=niceRound(zRight);
		if (zR === '0'){
			context.fillText('P(χ2 < 0) = 0.5000', 0.67*width, 0.12*height+80);
		}
		else{
			context.fillText('P(χ2 < ' + zR + ') = ' + evaluateArea(zLeft,zRight,df).toFixed(4), 0.67*width, 0.12*height+80);
		}
	}
	else if(leftIsInfinity === 1 && rightIsInfinity === 0){

		zR=niceRound(zRight);
		if (zR === '0'){
			context.fillText('P(χ2 > 0) = 0.5000', 0.67*width, 0.12*height+80);
		}
		else{
			context.fillText('P(χ2 > ' + zR + ') = ' + evaluateArea(zLeft,zRight,df).toFixed(4), 0.67*width, 0.12*height+80);
		}
	}
	else if(leftIsInfinity === 0 && rightIsInfinity === 1){

		zL=niceRound(zLeft);
		if (zL === '0'){
			context.fillText('P(χ2 > 0) = 0.5000', 0.67*width, 0.12*height+80);
		}
		else{
			context.fillText('P(χ2 > ' + zL + ') = ' + evaluateArea(zLeft,zRight,df).toFixed(4), 0.67*width, 0.12*height+80);
		}
	}
	else if(leftIsInfinity === 0 && rightIsInfinity === -1){

		zL=niceRound(zLeft);
		if (zL === '0'){
			context.fillText('P(χ2 < 0) = 0.5000', 0.67*width, 0.12*height+80);
		}
		else{
			context.fillText('P(χ2 < ' + zL + ') = ' + evaluateArea(zLeft,zRight,df).toFixed(4), 0.67*width, 0.12*height+80);
		}
	}
	else{

		context.fillText('P(-∞ < χ2 < ∞) = 1.0000', 0.66*width, 0.12*height+80);
	}
}


function mouseMoveHandler(event){

	//If the df slider was clicked
	if (!isStuckdf && (Math.abs((mouseX) - 195) < 150)) {
		dfPixel = mouseX;
		df = Math.round(1+((dfPixel-45)/300)*dfRange);
		if(df >= 10){
			df = 10;
		}
		draw();
	}
	//If the left point was clicked
	else if (!isStuckL) {
		zPixelLeft = mouseX;
		zLeft = zMin + zPixelLeft/width*zRange;
		draw();
	}
	//If the right point was clicked
	else if (!isStuckR) {
		zPixelRight = mouseX;
		zRight = zMin + zPixelRight/width*zRange;
		draw();
	}
}

function mouseClickHandler(event){

	var distFromZLeft = Math.abs((mouseX) - zPixelLeft) + Math.abs((mouseY) - (height-5));
	var distFromZRight = Math.abs((mouseX) - zPixelRight) + Math.abs((mouseY) - (height-5));
	var distFromdf = Math.abs((mouseX) - dfPixel) + Math.abs((mouseY) - (height-400));

	//If the click happened on the df slider
	if (distFromdf < 40){
		if(isStuckdf){
			isStuckdf = false;
			isStuckL = true;
			isStuckR = true;

			dfPixel = mouseX;
			if(dfPixel < 45){
				dfPixel = 45;
			}
			if(dfPixel > 345){
				dfPixel = 345;
			}

			df = Math.round(1+((dfPixel-45)/300)*dfRange);
			if(df <= 1){
				df = 1;
			}
			if(df >= 10){
				df = 10;
			}
		}
		else{
			isStuckdf = true;
			isStuckL = true;
			isStuckR = true;
		}
		draw();
	}
	//If the click happened near both points, take the right one
	else if (distFromZLeft < 40 && distFromZRight < 40){
		isStuckdf = true;
		isStuckL = true;
		isStuckR = false;

		isStuckR = false;
		zPixelRight = mouseX;
		zRight = zMin + zPixelRight/width*zRange;

		draw();
	}
	//Otherwise there is no ambiguity as to which point was clicked
	else{
		//If the click happened near the left point, which is currently stuck
		if (isStuckL && distFromZLeft < 40){
			isStuckdf = true;
			isStuckL = false;
			zPixelLeft = mouseX;
			zLeft = zMin + zPixelLeft/width*zRange;

			draw();
		}
		//Otherwise, keep the point stuck
		else{
			isStuckdf = true;
			isStuckL = true;
		}

		//If the click happened near the right point, which is currently stuck
		if (isStuckR && distFromZRight < 40){
			isStuckdf = true;
			isStuckR = false;
			zPixelRight = mouseX;
			zRight = zMin + zPixelRight/width*zRange;

			draw();
		}
		//Otherwise, keep the point stuck
		else{
			isStuckdf = true;
			isStuckR = true;
		}
	}
}

function mouseUnClickHandler(event){

	//If the mouse button is released, stick all points
	isStuckL = true;
	isStuckR = true;
	isStuckdf = true;
}

$(document).ready(function(){

	var canvas = $('#canvas');
	canvas.bind('mousemove', mouseMoveHandler);
	canvas.bind('mousedown', mouseClickHandler);
	canvas.bind('mouseup', mouseUnClickHandler);
	draw();

	$('#canvas').mousemove(function(e){
    	mouseX = e.pageX-$('#canvas').offset().left;
    	mouseY = e.pageY-$('#canvas').offset().top;

    	if(mouseX < 1 || mouseX > 998){
			//If the mouse moves off the canvas, stick all points
			isStuckL = true;
			isStuckR = true;
			isStuckdf = true;
		}
	});
});

</script>
